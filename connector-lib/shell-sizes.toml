# MIL-DTL-26482 plug shell dimensions per shell size.
#
# Source: MIL-DTL-26482H, FIGURE 5 "Connector intermateability control
# dimensions (series 1 and series 2)". Values are in inches, as in the
# standard (metric equivalents there are for information only).
#
#   Drawings ............................ page 16 (plugs and receptacles), 17 (details), 21 (keys)
#   Key widths, insert face details ..... page 17 ([common] below)
#   Key angles .......................... page 21 ([common] below)
#   P, R, S, T .......................... page 19
#   U, V, W, X, Y, Z .................... page 20
#
# The table letters are kept so values can be checked against the standard.
# Toleranced values are [min, max]; single values are a min or max limit.
#
#   insert_dia_max    P  max insert diameter                    (page 19)
#   shell_id_min      Z  min plug shell ID (room for insert)   (page 20)
#   shell_od          Y  plug shell OD                          (page 20)
#   key_dia           X  diameter over plug keys                (page 20)
#   coupling_ring_id  W  coupling ring ID                       (page 20)
#   groove_dia        V  coupling ring bayonet groove diameter  (page 20)
#
# Mating receptacle (for reference, page 19/20):
#   receptacle_shell_id  R  receptacle shell ID
#   keyway_dia           S  diameter over receptacle keyways
#   receptacle_shell_od  T  receptacle shell OD
#   bayonet_dia          U  diameter over receptacle bayonet pins

# Dimensions common to all shell sizes (page 17).
[common]
# "Plug keys/receptacle keyways mating detail". 1 master + 4 minor keys.
master_key_width     = [0.108, 0.116]
minor_key_width      = [0.040, 0.048]
master_keyway_width  = [0.125, 0.133]
minor_keyway_width   = [0.062, 0.070]
# Plug key positions, clockwise from the master key, viewed from the plug
# engaging face (page 21, "Plug keys and bayonet grooves").
master_key_angle     = 0
minor_key_angles     = [105, 140, 215, 265]

# Detail A: socket insert face, per contact size.
[common.socket_insert.entry_dia]         # contact entry hole at the face
"20" = [0.049, 0.059]
"16" = [0.071, 0.081]
"12" = [0.102, 0.112]

[common.socket_insert.counterbore_dia]   # receives the pin insert seal boss
"20xx" = [0.092, 0.096]
"20"   = [0.114, 0.118]
"16"   = [0.146, 0.150]
"12"   = [0.206, 0.210]

# Detail B: pin insert resilient face seal, per contact size.
[common.pin_insert.seal_boss_dia]
"20xx" = [0.084, 0.090]
"20"   = [0.106, 0.112]
"16"   = [0.138, 0.144]
"12"   = [0.198, 0.204]

